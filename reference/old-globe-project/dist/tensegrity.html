<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tensegrity sphere</title>
<style>
:root{--bg:#000;--ui:rgba(255,255,255,.65);box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ui);font:14px/1.4 system-ui,sans-serif;color-scheme:dark}
body{display:flex;flex-direction:column}
canvas{flex:1;width:100%;min-height:0;display:block;touch-action:none;cursor:grab}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:center;padding:12px 16px}
button{background:none;border:1px solid var(--ui);color:var(--ui);padding:6px 14px;border-radius:999px;font:inherit;cursor:pointer}
button:hover,button:focus-visible{background:#fff;color:#000;outline:none}
label{display:flex;gap:8px;align-items:center}
input[type=range]{accent-color:#fff;width:110px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">

  for(const {L,g,Q} of drawn){
    for(const [a,b] of L.C)segs.push({a:Q[a],b:Q[b],s:0,g:Math.min(g[a],g[b])});
    for(const [a,b] of L.S)segs.push({a:Q[a],b:Q[b],s:1,g:Math.min(g[a],g[b])});
  }
  for(const s of segs)s.z=(s.a[2]+s.b[2])/2;
  segs.sort((p,q)=>p.z-q.z);
  ctx.lineCap='round';ctx.strokeStyle='#fff';
  const wS=Math.max(1,Math.min(3.6,S*0.0075)),wC=Math.max(0.4,Math.min(0.9,S*0.0016));
  for(const s of segs){
    const a=Math.min(1,Math.max(0,(s.g-0.3)*1.6));
    if(a<=0)continue;
    const depth=Math.max(0,Math.min(1,(s.z+1.15)/2.3));
    ctx.globalAlpha=(0.22+0.78*depth)*a*(s.s?1:0.5);
    ctx.lineWidth=s.s?wS:wC;
    ctx.beginPath();
    ctx.moveTo(X+(s.a[0]-camC[0])*S,Y-(s.a[1]-camC[1])*S);
    ctx.lineTo(X+(s.b[0]-camC[0])*S,Y-(s.b[1]-camC[1])*S);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(spin&&!drag)rotY+=dt*0.00018;
  requestAnimationFrame(frame);
}
start();requestAnimationFrame(frame);
$('replay').onclick=start;
$('freq').oninput=setDensity;$('time').oninput=setTime;
$('spin').onclick=()=>{spin=!spin;$('spin').textContent='Spin: '+(spin?'on':'off');};
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{if(!drag)return;rotY+=(e.clientX-drag.x)*0.008;rotX+=(e.clientY-drag.y)*0.008;drag={x:e.clientX,y:e.clientY};});
cv.addEventListener('pointerup',()=>{drag=null;cv.style.cursor='grab';});
</script>
</body>
